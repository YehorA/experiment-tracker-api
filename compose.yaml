services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: experiment_tracker
      POSTGRES_USER: experiment_user
      POSTGRES_PASSWORD: 123321
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U experiment_user -d experiment_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://experiment_user:123321@db:5432/experiment_tracker
    ports:
      - "8000:8000"
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

volumes:
  postgres_data: